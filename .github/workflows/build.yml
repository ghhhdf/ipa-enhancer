name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Fetch lz4 + brotli sources
        run: |
          git clone --depth 1 https://github.com/lz4/lz4.git
          git clone --depth 1 https://github.com/google/brotli.git

      - name: Unit test (macOS host, real Foundation/ObjC runtime)
        run: |
          {
            set -x
            BROTLI_ALL=$(ls brotli/c/common/*.c brotli/c/dec/*.c brotli/c/enc/*.c)
            clang -g -O1 -DENH_DEBUG -Ilz4/lib -Ibrotli/c/include \
              test_main.m \
              lz4/lib/lz4.c lz4/lib/lz4frame.c lz4/lib/lz4hc.c lz4/lib/xxhash.c \
              $BROTLI_ALL \
              -framework Foundation -lz -lbz2 \
              -o tester
            ./tester || true
          } > test.log 2>&1
          cat test.log
          if ! grep -q 'FAIL 0' test.log; then
            echo '=== TESTS FAILED ==='
            exit 42
          fi

      - name: Build dylib (arm64, iPhoneOS SDK)
        run: |
          {
            set -x
            SDK=$(xcrun -sdk iphoneos --show-sdk-path)
            echo "SDK: $SDK"
            BROTLI_SRC=$(ls brotli/c/common/*.c brotli/c/dec/*.c)
            xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=11.0 \
              -dynamiclib -O2 \
              -Ilz4/lib -Ibrotli/c/include \
              enhancer.m \
              lz4/lib/lz4.c lz4/lib/lz4frame.c lz4/lib/lz4hc.c lz4/lib/xxhash.c \
              $BROTLI_SRC \
              -framework Foundation \
              -lz -lbz2 \
              -install_name @executable_path/Frameworks/libipaenhancer.dylib \
              -Wl,-headerpad_max_install_names \
              -o libipaenhancer.dylib
            file libipaenhancer.dylib
          } > build.log 2>&1 || true
          if [ ! -f libipaenhancer.dylib ]; then
            echo "BUILD FAILED, see build.log in release"
            exit 42
          fi
          tail -5 build.log

      - name: Upload log to release (failure)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: build log ${{ github.run_number }}
          files: |
            build.log
            test.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: libipaenhancer
          path: libipaenhancer.dylib

      - name: Publish to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: dylib build ${{ github.run_number }}
          files: libipaenhancer.dylib
